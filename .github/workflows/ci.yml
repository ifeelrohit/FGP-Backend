name: FGP-Backend Authoritative CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-and-test:
    name: Lint, Validate, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fgp_test_user
          POSTGRES_PASSWORD: fgp_test_password
          POSTGRES_DB: fgp_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://fgp_test_user:fgp_test_password@localhost:5432/fgp_test_db?schema=public
      JWT_ACCESS_SECRET: test_ci_jwt_access_secret_super_secure_32_bytes
      JWT_REFRESH_SECRET: test_ci_jwt_refresh_secret_super_secure_32_bytes
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      LOG_LEVEL: silent

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Migrations to Test Database
        run: npx prisma migrate deploy

      - name: Seed Database
        run: npm run prisma:seed

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Execute Vitest Test Suites
        run: npm test

      - name: Build Production Bundle
        run: npm run build
